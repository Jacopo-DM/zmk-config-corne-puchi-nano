# This file generates the GitHub Actions matrix. For simple board + shield
# combinations, add them to the top level board and shield arrays, for more
# control, add individual board + shield combinations to the `include` property.
# You can also use the `cmake-args` property to pass flags to the build command,
# `snippet` to add a Zephyr snippet, and `artifact-name` to assign a name to
# distinguish build outputs from each other:
# 
# --- STUDIO EG ---
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
# --- LOGGING EG ---
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # Studio, battery forwarding and the pairing PIN apply to the central
  # (left) half only. The snippet adds the USB serial endpoint Studio talks
  # to; the battery flags make the left half read the right half's level and
  # report it to the computer as a second battery; the PIN is typed on the
  # keyboard when pairing with a computer.
  - board: puchi_ble_v1
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
      -DCONFIG_ZMK_BLE_PASSKEY_ENTRY=y
  - board: puchi_ble_v1
    shield: corne_right
  # Flash to both halves to erase all stored pairings, then flash the
  # normal firmware again.
  - board: puchi_ble_v1
    shield: settings_reset

