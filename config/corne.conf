### ------------------ BASIC ------------------ ###
### Keyboard name
# CONFIG_ZMK_KEYBOARD_NAME="jmdm corne"
# CONFIG_ZMK_BLE=y

### Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# No PIN prompt when pairing
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Tune bluetooth profiles for quick select
# CONFIG_BT_MAX_CONN=3

### ------------------ POWER OPTIONS ------------------ ###
# Uncomment the following line to enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Milliseconds of inactivity before entering deep sleep
# 15 min (15*60*1000ms)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# 30 min (30*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Milliseconds of inactivity before entering idle state
# 1 min (1*60*1000ms)
# CONFIG_ZMK_IDLE_TIMEOUT=60000
# 2 min (2*60*1000ms)
# CONFIG_ZMK_IDLE_TIMEOUT=120000

### ------------------ MOUSE ------------------ ###
# https://github.com/zmkfirmware/zmk/blob/main/docs/docs/keymaps/behaviors/mouse-emulation.md
# CONFIG_ZMK_MOUSE=y

### ------------------ ZMK STUDIO ------------------ ###
# Enabled for the left half only, in build.yaml: these settings exist only on
# the central, and this file is read by both halves.
# https://zmk.dev/docs/features/studio

### ------------------ DEBOUNCE ------------------ ###
# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### ------------------ OTHERS ------------------ ###
### Improves compatibility with iPad
# ref: https://zmk.dev/docs/config/system#hid
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

### DEBUG OPTIONS
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000